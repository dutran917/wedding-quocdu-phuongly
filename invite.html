<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tải thiệp cưới – Quốc Du &amp; Phương Ly</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Great+Vibes&family=Cormorant+Garamond:ital,wght@1,400;1,500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background: #2d3d2e;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }

    .card {
      background: #f5f1eb;
      border-radius: 20px;
      padding: 36px 28px 32px;
      width: 100%; max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
      text-align: center;
    }

    .hy {
      width: 54px; height: 54px;
      background: #3d5a3e;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 18px;
      font-size: 1.8rem; color: #fff;
    }

    .title {
      font-family: 'Great Vibes', cursive;
      font-size: 2rem;
      color: #3d5a3e;
      line-height: 1.2;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: .78rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #777;
      margin-bottom: 24px;
    }

    .divider {
      border: none;
      border-top: 1px solid #d0c8be;
      margin: 0 auto 24px;
      width: 60%;
    }

    label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #3d5a3e;
      margin-bottom: 10px;
      text-align: left;
    }

    input[type="text"] {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid #d0c8be;
      border-radius: 10px;
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: 1rem;
      color: #2a2a2a;
      background: #faf8f4;
      outline: none;
      transition: border-color .2s;
      margin-bottom: 16px;
    }
    input[type="text"]:focus { border-color: #3d5a3e; }

    .preview-wrap {
      margin-bottom: 16px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(45, 61, 46, .18);
      background: #f3eee4;
    }

    #preview {
      display: block;
      width: 100%;
      height: auto;
      vertical-align: top;
    }

    .hint {
      font-size: .75rem;
      color: #777;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .btn-download {
      width: 100%;
      background: #3d5a3e;
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 50px;
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: .9rem;
      font-weight: 600;
      letter-spacing: 2px;
      cursor: pointer;
      transition: background .2s, transform .15s, opacity .2s;
    }
    .btn-download:hover { background: #506e52; transform: scale(1.02); }
    .btn-download:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      margin-top: 12px;
      min-height: 1.2em;
      font-size: .78rem;
      color: #3d5a3e;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="hy">喜</div>
    <p class="title">Quốc Du &amp; Phương Ly</p>
    <p class="subtitle">Tải thiệp cưới</p>
    <hr class="divider"/>

    <label for="guest-input">Tên người được mời</label>
    <input type="text" id="guest-input"
           placeholder="VD: Anh Minh, Gia đình chú Hùng…"
           autocomplete="name"
           onkeydown="if(event.key==='Enter') downloadInvite()"/>

    <div class="preview-wrap">
      <canvas id="preview" width="1024" height="1536" aria-label="Xem trước thiệp cưới"></canvas>
    </div>
    <p class="hint">Tên sẽ hiện ngay dưới dòng “Trân trọng kính mời”. Trên điện thoại, chọn <strong>Lưu ảnh</strong> để đưa vào thư viện.</p>

    <button class="btn-download" id="btn-download" onclick="downloadInvite()">Tải thiệp cưới</button>
    <p class="status" id="status"></p>
  </div>

  <script>
    const TEMPLATE_SRC = 'assets/invite_wedding.jpg';
    const CARD_W = 1024;
    const CARD_H = 1536;
    const TEXT_COLOR = '#5c4638';
    const NAME_BASELINE_Y = 351;
    const NAME_MAX_WIDTH = 520;
    const NAME_FONT_SIZE = 54;
    const NAME_MIN_SIZE = 30;

    const canvas = document.getElementById('preview');
    const ctx = canvas.getContext('2d');
    const input = document.getElementById('guest-input');
    const btn = document.getElementById('btn-download');
    const statusEl = document.getElementById('status');

    const templateImg = new Image();
    templateImg.crossOrigin = 'anonymous';
    let templateReady = false;

    templateImg.onload = async () => {
      templateReady = true;
      await document.fonts.load(nameFont(NAME_FONT_SIZE)).catch(() => []);
      await document.fonts.ready;
      drawCard();
    };
    templateImg.onerror = () => {
      statusEl.textContent = 'Không tải được ảnh thiệp. Hãy mở trang qua http, không mở file trực tiếp.';
    };
    templateImg.src = TEMPLATE_SRC;

    input.addEventListener('input', () => {
      statusEl.textContent = '';
      drawCard();
    });

    function drawCard() {
      ctx.clearRect(0, 0, CARD_W, CARD_H);
      if (templateReady) {
        ctx.drawImage(templateImg, 0, 0, CARD_W, CARD_H);
      } else {
        ctx.fillStyle = '#f3eee4';
        ctx.fillRect(0, 0, CARD_W, CARD_H);
      }

      const name = input.value.trim();
      if (!name) return;

      ctx.save();
      let fontSize = NAME_FONT_SIZE;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = TEXT_COLOR;

      while (fontSize > NAME_MIN_SIZE) {
        ctx.font = nameFont(fontSize);
        if (ctx.measureText(name).width <= NAME_MAX_WIDTH) break;
        fontSize -= 1;
      }
      ctx.font = nameFont(fontSize);
      const nameWidth = Math.min(ctx.measureText(name).width, NAME_MAX_WIDTH) + 20;
      const left = (CARD_W - nameWidth) / 2;
      if (templateReady) {
        ctx.drawImage(templateImg, left, 310, nameWidth, 22, left, 335, nameWidth, 22);
      }
      ctx.fillText(name, CARD_W / 2, NAME_BASELINE_Y, NAME_MAX_WIDTH);
      ctx.restore();
    }

    function nameFont(size) {
      return 'italic 500 ' + size + 'px "Cormorant Garamond", serif';
    }

    function slugName(name) {
      return name
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/đ/g, 'd').replace(/Đ/g, 'D')
        .replace(/[^a-zA-Z0-9]+/g, '-')
        .replace(/^-|-$/g, '')
        .toLowerCase()
        .slice(0, 40) || 'khach';
    }

    async function downloadInvite() {
      const name = input.value.trim();
      if (!name) {
        input.focus();
        statusEl.textContent = 'Hãy nhập tên người được mời.';
        return;
      }
      if (!templateReady) {
        statusEl.textContent = 'Ảnh thiệp chưa sẵn sàng, thử lại sau giây lát.';
        return;
      }

      btn.disabled = true;
      statusEl.textContent = 'Đang tạo thiệp…';
      try {
        await document.fonts.load(nameFont(NAME_FONT_SIZE)).catch(() => []);
        await document.fonts.ready;
        drawCard();

        const blob = await new Promise((resolve, reject) => {
          canvas.toBlob(b => b ? resolve(b) : reject(new Error('toBlob failed')), 'image/jpeg', 0.92);
        });

        const filename = 'thiep-cuoi-' + slugName(name) + '.jpg';
        const file = new File([blob], filename, { type: 'image/jpeg' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: 'Thiệp cưới Quốc Du & Phương Ly'
            });
            statusEl.textContent = 'Chọn Lưu ảnh để đưa thiệp vào thư viện.';
            return;
          } catch (err) {
            if (err && err.name === 'AbortError') {
              statusEl.textContent = '';
              return;
            }
          }
        }

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
        statusEl.textContent = 'Đã tải thiệp. Trên iPhone, giữ ảnh rồi chọn Lưu ảnh nếu máy không tải tự động.';
      } catch (err) {
        statusEl.textContent = 'Không tạo được thiệp. Thử lại nhé.';
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
