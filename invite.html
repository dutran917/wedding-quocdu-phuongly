<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tạo link mời – Quốc Du &amp; Phương Ly</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background: #2d3d2e;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }

    .card {
      background: #f5f1eb;
      border-radius: 20px;
      padding: 40px 32px 36px;
      width: 100%; max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
      text-align: center;
    }

    .hy {
      width: 54px; height: 54px;
      background: #3d5a3e;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 18px;
      font-size: 1.8rem; color: #fff;
    }

    .title {
      font-family: 'Great Vibes', cursive;
      font-size: 2rem;
      color: #3d5a3e;
      line-height: 1.2;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: .78rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #777;
      margin-bottom: 28px;
    }

    .divider {
      border: none;
      border-top: 1px solid #d0c8be;
      margin: 0 auto 28px;
      width: 60%;
    }

    label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #3d5a3e;
      margin-bottom: 10px;
      text-align: left;
    }

    input[type="text"] {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid #d0c8be;
      border-radius: 10px;
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: 1rem;
      color: #2a2a2a;
      background: #faf8f4;
      outline: none;
      transition: border-color .2s;
      margin-bottom: 16px;
    }
    input[type="text"]:focus { border-color: #3d5a3e; }

    .btn-gen {
      width: 100%;
      background: #3d5a3e;
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 50px;
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: .9rem;
      font-weight: 600;
      letter-spacing: 2px;
      cursor: pointer;
      transition: background .2s, transform .15s;
      margin-bottom: 24px;
    }
    .btn-gen:hover { background: #506e52; transform: scale(1.02); }

    /* Result box */
    .result-box {
      display: none;
      background: #fff;
      border: 1.5px solid #c8ddb5;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
    }
    .result-box.show { display: block; }

    .result-label {
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #3d5a3e;
      margin-bottom: 8px;
    }

    .result-url {
      font-size: .82rem;
      color: #444;
      word-break: break-all;
      line-height: 1.5;
      background: #f5f1eb;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      user-select: all;
    }

    .result-actions {
      display: flex; gap: 8px;
    }

    .btn-copy, .btn-open-link {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      font-size: .78rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background .2s, transform .1s;
      border: none;
    }
    .btn-copy {
      background: #3d5a3e; color: #fff;
    }
    .btn-copy:hover { background: #506e52; }
    .btn-copy.copied { background: #6ea050; }

    .btn-open-link {
      background: transparent;
      color: #3d5a3e;
      border: 1.5px solid #3d5a3e;
    }
    .btn-open-link:hover { background: #edf5ed; }

    .preview-guest {
      margin-top: 16px;
      font-size: .82rem;
      color: #777;
      text-align: center;
    }
    .preview-guest strong {
      font-family: 'Great Vibes', cursive;
      font-size: 1.2rem;
      color: #3d5a3e;
      display: block;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="hy">喜</div>
    <p class="title">Quốc Du &amp; Phương Ly</p>
    <p class="subtitle">Tạo link mời cá nhân</p>
    <hr class="divider"/>

    <label for="guest-input">Tên người được mời</label>
    <input type="text" id="guest-input"
           placeholder="VD: Anh Minh, Gia đình chú Hùng…"
           onkeydown="if(event.key==='Enter') generateLink()"/>
    <button class="btn-gen" onclick="generateLink()">✉ Tạo link mời</button>

    <div class="result-box" id="result-box">
      <p class="result-label">Link mời</p>
      <div class="result-url" id="result-url"></div>
      <div class="result-actions">
        <button class="btn-copy" id="btn-copy" onclick="copyLink()">📋 Sao chép</button>
        <button class="btn-open-link" onclick="openLink()">🔗 Xem thiệp</button>
      </div>
      <p class="preview-guest">
        Khách sẽ thấy: "TRÂN TRỌNG KÍNH MỜI"
        <strong id="preview-name"></strong>
      </p>
    </div>
  </div>

  <script>
    const BASE_URL = 'https://thiepcuoi-quocdu-phuongly.vercel.app';
    let currentLink = '';

    function generateLink() {
      const name = document.getElementById('guest-input').value.trim();
      if (!name) {
        document.getElementById('guest-input').focus();
        return;
      }

      const encoded = encodeURIComponent(name);
      currentLink   = BASE_URL + '/?to=' + encoded;

      document.getElementById('result-url').textContent  = currentLink;
      document.getElementById('preview-name').textContent = name;
      document.getElementById('result-box').classList.add('show');

      // Reset nút copy
      const btn = document.getElementById('btn-copy');
      btn.textContent = '📋 Sao chép';
      btn.classList.remove('copied');
    }

    async function copyLink() {
      if (!currentLink) return;
      try {
        await navigator.clipboard.writeText(currentLink);
      } catch {
        // Fallback
        const ta = document.createElement('textarea');
        ta.value = currentLink;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      const btn = document.getElementById('btn-copy');
      btn.textContent = '✅ Đã sao chép!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = '📋 Sao chép';
        btn.classList.remove('copied');
      }, 2500);
    }

    function openLink() {
      if (currentLink) window.open(currentLink, '_blank');
    }
  </script>
</body>
</html>
